# Proje genelindeki Gradle ayarları.

# JVM bellek ayarları (daha hızlı, daha kararlı derleme için)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX kütüphane paketini kullan (ZORUNLU — bu satır olmadan proje derlenmez,
# çünkü tüm bağımlılıklar androidx.* paketlerinden geliyor).
android.useAndroidX=true

# Eski destek kütüphanesinden AndroidX'e otomatik dönüştürmeyi kapat
# (bu proje zaten sıfırdan AndroidX kullanıyor, jetifier'a gerek yok).
android.enableJetifier=false

# Kotlin resmi kod stilini kullan
kotlin.code.style=official

# Derlemeleri paralel modüllerde çalıştır
org.gradle.parallel=true

# Yapılandırmayı önbelleğe al (daha hızlı ardışık derlemeler)
org.gradle.caching=true

# R sınıfı alan adlarını (non-transitive R class) modern Android Gradle Plugin ile kullan
android.nonTransitiveRClass=true
