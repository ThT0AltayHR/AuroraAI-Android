name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3

      - name: Android SDK komut satırı araçlarını kur
        uses: android-actions/setup-android@v3

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew || true

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon

      - name: Sürüm etiketi oluştur
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: APK'yı Artifacts sekmesine yükle
        uses: actions/upload-artifact@v4
        with:
          name: aurora-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: GitHub Release oluştur ve APK'yı ekle (otomatik indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Aurora AI — build ${{ github.run_number }}"
          body: |
            Bu sürüm GitHub Actions tarafından otomatik olarak derlendi.
            Aşağıdaki **Assets** bölümünden `app-debug.apk` dosyasını indirip telefonuna kurabilirsin.

            > Kurulum için telefonunda "Bilinmeyen kaynaklardan yükleme" iznini açman gerekebilir.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
